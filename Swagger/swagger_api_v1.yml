---
openapi: 3.0.3
info:
  title: shappar
  version: '1.0'
  contact:
    name: Fujiya
  description: shappar api
servers:
- url: http://localhost:3000
- url: https://localhost:3000
paths:
  "/auth/sign":
    post:
      summary: ''
      description: sign in with id token
      tags:
      - auth
      parameters:
      - name: idToken
        in: header
        required: true
        description: 認証に利用するIDトークン
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            jwt:
              description: 認証成功時に返却するアプリケーション用JWT
              schema:
                type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSignResponse"
              examples:
                ExistingUser:
                  value:
                    registered: true
                    user:
                      id: 86f455ff-5029-4207-9300-b9dea5fe9d37
                      name: sample_user_name
                      unique_id: sample_user_001
                      thumbnail_url: http://example.com/iconURL
                NewUser:
                  value:
                    registered: false
                    user: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                example-1:
                  value:
                    detail: IDトークンが不正です。
  "/posts":
    post:
      summary: ''
      description: new post
      tags:
      - posts
      requestBody:
        description: request body
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      select_num:
                        type: integer
                      answer:
                        type: string
            examples:
              201 Created:
                value: {}
              400 Bad Request:
                value:
                  unique_id: 86f455ff-5029-4207-9300-b9dea5fe9d37
                  question: ''
                  options:
                  - select_num: 1
                    answer: ''
                  - select_num: 2
                    answer: ''
              example-2:
                value: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              examples:
                201 Created:
                  value: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: string
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        answer:
                          type: string
              examples:
                400 Bad Request:
                  value:
                    question:
                    - この項目は空にできません。
                    options:
                    - answer:
                      - この項目は空にできません。
                example-2:
                  value:
                    options:
                    - answer:
                      - 回答は10個以下にしてください
                example-3:
                  value:
                    options:
                    - answer:
                      - 回答は2個以上にしてください
  "/posts/{post_id}":
    parameters:
    - name: post_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Your GET endpoint
      tags:
      - posts
      description: get post details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  voted_sex:
                    type: object
                    properties:
                      woman:
                        type: integer
                      man:
                        type: integer
                      others:
                        type: integer
                      'null':
                        type: integer
                  voted_blood_type:
                    type: object
                    properties:
                      A:
                        type: integer
                      B:
                        type: integer
                      O:
                        type: integer
                      AB:
                        type: integer
                      others:
                        type: integer
                  voted_age:
                    type: object
                    properties:
                      0-10:
                        type: integer
                      10-20:
                        type: integer
                      20-30:
                        type: integer
                      30-40:
                        type: integer
                      40-50:
                        type: integer
                      50-60:
                        type: integer
                      60-:
                        type: integer
                  voted_month:
                    type: object
                    properties:
                      '1':
                        type: integer
                      '2':
                        type: integer
                      '3':
                        type: integer
                      '4':
                        type: integer
                      '5':
                        type: integer
                      '6':
                        type: integer
                      '7':
                        type: integer
                      '8':
                        type: integer
                      '9':
                        type: integer
                      '10':
                        type: integer
                      '11':
                        type: integer
                      '12':
                        type: integer
                  total:
                    type: integer
              examples:
                200 OK:
                  value:
                    voted_sex:
                      woman: 4
                      others: 1
                      man: 6
                      'null': 0
                    voted_blood_type:
                      A: 3
                      B: 4
                      AB: 3
                      others: 1
                    voted_age:
                      0-10: 0
                      10-20: 5
                      20-30: 4
                      30-40: 1
                      40-50: 0
                      50-60: 1
                      60-: 0
                    voted_month:
                      '1': 0
                      '2': 2
                      '3': 1
                      '4': 0
                      '5': 0
                      '6': 2
                      '7': 1
                      '8': 0
                      '9': 1
                      '10': 1
                      '11': 2
                      '12': 1
                    total: 11
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                example-1:
                  value:
                    detail: 存在しない投稿IDです。
    delete:
      summary: ''
      description: delete post
      tags:
      - posts
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                example-1:
                  value:
                    detail: 権限がありません。
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                example-1:
                  value:
                    detail: 存在しない投稿IDです。
  "/posts/{post_id}/polls":
    parameters:
    - name: post_id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: ''
      description: vote post
      tags:
      - posts
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                option:
                  type: object
                  properties:
                    select_num:
                      type: integer
            examples:
              201 Created:
                value:
                  option:
                    select_num: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        select_num:
                          type: integer
                        votes:
                          type: integer
                  selected_num:
                    type: integer
                  total:
                    type: integer
              examples:
                201 Created:
                  value:
                    options:
                    - select_num: 2
                      votes: 0
                    - select_num: 3
                      votes: 0
                    - select_num: 4
                      votes: 0
                    - select_num: 1
                      votes: 1
                    selected_num: 1
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  non_field_errors:
                    type: string
              examples:
                example-1:
                  value:
                    non_field_errors:
                    - 同ユーザーの投稿への投票は一度のみです。
                example-2:
                  value:
                    non_field_errors:
                    - 自身が投稿した投稿への投票はできません。
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                example-1:
                  value:
                    detail: 存在しない投稿IDです。
